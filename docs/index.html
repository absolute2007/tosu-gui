<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>tosu GUI</title>
    <meta
      name="description"
      content="Desktop GUI for tosu — osu! memory reader with counters, overlay, maps, skins, and settings."
    />
    <link rel="icon" href="assets/icon.png" type="image/png" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="page">
      <header class="header">
        <div class="brand">
          <img class="brand-icon" src="assets/icon.svg" width="36" height="36" alt="" />
          <h1 class="brand-name">tosu GUI</h1>
        </div>
        <div class="header-actions">
          <div class="lang-switch" role="group" aria-label="Language">
            <button type="button" class="lang-btn" data-lang="ru" aria-pressed="true">RU</button>
            <button type="button" class="lang-btn" data-lang="en" aria-pressed="false">EN</button>
          </div>
          <a
            class="header-link"
            href="https://github.com/absolute2007/tosu-gui"
            rel="noopener noreferrer"
          >
            GitHub
          </a>
        </div>
      </header>

      <p class="lead" data-i18n="lead"></p>

      <section class="download" aria-labelledby="download-heading">
        <h2 id="download-heading" class="sr-only" data-i18n="download">Скачать</h2>
        <div class="download-row">
          <label class="version-label" for="version">
            <span data-i18n="version">Версия</span>
            <select id="version" disabled>
              <option value="">…</option>
            </select>
          </label>
          <a id="download-setup" class="btn btn-primary" href="#" aria-disabled="true">
            Setup (.exe)
          </a>
          <a id="download-zip" class="btn btn-ghost" href="#" aria-disabled="true">ZIP</a>
        </div>
        <p id="download-meta" class="download-meta" data-i18n="loading">Загрузка списка релизов…</p>
        <p class="download-note">Windows 10/11 · x64</p>
      </section>

      <section class="shots" aria-label="Screenshots">
        <svg class="shots-connector-svg" aria-hidden="true">
          <path class="connector-path" d="" />
          <g class="connector-dots"></g>
        </svg>

        <article class="shot-row">
          <figure class="shot-media">
            <button type="button" class="shot-trigger" data-gallery-id="main" aria-label="Увеличить скриншот: Главное окно">
              <img
                class="shot-main-img"
                src="assets/screenshots/Main.png"
                alt=""
                width="1464"
                height="935"
                loading="eager"
              />
              <span class="shot-hint" aria-hidden="true">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <circle cx="11" cy="11" r="8"></circle>
                  <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
                  <line x1="11" y1="8" x2="11" y2="14"></line>
                  <line x1="8" y1="11" x2="14" y2="11"></line>
                </svg>
              </span>
            </button>
          </figure>
          <div class="shot-copy">
            <h3 class="shot-title" data-i18n="shotMainTitle"></h3>
            <p class="shot-body" data-i18n="shotMainBody"></p>
          </div>
        </article>

        <article class="shot-row -flip">
          <figure class="shot-media shot-media-duo">
            <button type="button" class="shot-trigger shot-trigger-overlay" data-gallery-id="overlay" aria-label="Увеличить скриншот: Оверлей">
              <img
                class="shot-overlay-img"
                src="assets/screenshots/Overlay.png"
                alt=""
                width="1184"
                height="1117"
                loading="lazy"
              />
              <span class="shot-hint" aria-hidden="true">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <circle cx="11" cy="11" r="8"></circle>
                  <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
                  <line x1="11" y1="8" x2="11" y2="14"></line>
                  <line x1="8" y1="11" x2="14" y2="11"></line>
                </svg>
              </span>
            </button>
            <button type="button" class="shot-trigger shot-trigger-panel" data-gallery-id="panel" aria-label="Увеличить скриншот: Внутриигровая панель">
              <img
                class="shot-panel-img"
                src="assets/screenshots/OverlayPanel.png"
                alt=""
                width="450"
                height="935"
                loading="lazy"
              />
              <span class="shot-hint" aria-hidden="true">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <circle cx="11" cy="11" r="8"></circle>
                  <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
                  <line x1="11" y1="8" x2="11" y2="14"></line>
                  <line x1="8" y1="11" x2="14" y2="11"></line>
                </svg>
              </span>
            </button>
          </figure>
          <div class="shot-copy">
            <h3 class="shot-title" data-i18n="shotOverlayTitle"></h3>
            <p class="shot-body" data-i18n="shotOverlayBody"></p>
          </div>
        </article>

        <article class="shot-row">
          <figure class="shot-media shot-media-maps">
            <button type="button" class="shot-trigger" data-gallery-id="maps" aria-label="Увеличить скриншот: Карты">
              <img
                class="shot-maps-img"
                src="assets/screenshots/Maps.png"
                alt=""
                width="615"
                height="882"
                loading="lazy"
              />
              <span class="shot-hint" aria-hidden="true">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <circle cx="11" cy="11" r="8"></circle>
                  <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
                  <line x1="11" y1="8" x2="11" y2="14"></line>
                  <line x1="8" y1="11" x2="14" y2="11"></line>
                </svg>
              </span>
            </button>
          </figure>
          <div class="shot-copy">
            <h3 class="shot-title" data-i18n="shotMapsTitle"></h3>
            <p class="shot-body" data-i18n="shotMapsBody"></p>
          </div>
        </article>

        <article class="shot-row -flip">
          <figure class="shot-media">
            <button type="button" class="shot-trigger" data-gallery-id="preview" aria-label="Увеличить скриншот: Превью карт">
              <img
                class="shot-preview-img"
                src="assets/screenshots/Preview.png"
                alt=""
                width="1464"
                height="935"
                loading="lazy"
              />
              <span class="shot-hint" aria-hidden="true">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <circle cx="11" cy="11" r="8"></circle>
                  <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
                  <line x1="11" y1="8" x2="11" y2="14"></line>
                  <line x1="8" y1="11" x2="14" y2="11"></line>
                </svg>
              </span>
            </button>
          </figure>
          <div class="shot-copy">
            <h3 class="shot-title" data-i18n="shotPreviewTitle"></h3>
            <p class="shot-body" data-i18n="shotPreviewBody"></p>
          </div>
        </article>

        <article class="shot-row">
          <figure class="shot-media">
            <button type="button" class="shot-trigger" data-gallery-id="skins" aria-label="Увеличить скриншот: Скины">
              <img
                class="shot-skins-img"
                src="assets/screenshots/Skins.png"
                alt=""
                width="1464"
                height="935"
                loading="lazy"
              />
              <span class="shot-hint" aria-hidden="true">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <circle cx="11" cy="11" r="8"></circle>
                  <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
                  <line x1="11" y1="8" x2="11" y2="14"></line>
                  <line x1="8" y1="11" x2="14" y2="11"></line>
                </svg>
              </span>
            </button>
          </figure>
          <div class="shot-copy">
            <h3 class="shot-title" data-i18n="shotSkinsTitle"></h3>
            <p class="shot-body" data-i18n="shotSkinsBody"></p>
          </div>
        </article>
      </section>

      <footer class="footer">
        <a
          href="https://github.com/absolute2007/tosu-gui/releases"
          rel="noopener noreferrer"
          data-i18n="allReleases"
          >Все релизы</a
        >
        <span class="sep">·</span>
        <a href="https://github.com/tosuapp/tosu" rel="noopener noreferrer">tosu</a>
      </footer>
    </main>

    <!-- Lightbox Modal -->
    <div id="lightbox" class="lightbox" role="dialog" aria-modal="true" aria-hidden="true">
      <div class="lightbox-backdrop" data-close-lightbox></div>
      <div class="lightbox-dialog" role="document">
        <div class="lightbox-bar">
          <span id="lightbox-counter" class="lightbox-counter">1 / 6</span>
          <button type="button" id="lightbox-close" class="lightbox-btn" aria-label="Закрыть" data-close-lightbox>
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <line x1="18" y1="6" x2="6" y2="18"></line>
              <line x1="6" y1="6" x2="18" y2="18"></line>
            </svg>
          </button>
        </div>

        <div class="lightbox-stage">
          <button type="button" id="lightbox-prev" class="lightbox-nav-btn lightbox-prev" aria-label="Предыдущий скриншот">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
              <polyline points="15 18 9 12 15 6"></polyline>
            </svg>
          </button>

          <div class="lightbox-figure">
            <img id="lightbox-img" class="lightbox-img" src="" alt="" />
          </div>

          <button type="button" id="lightbox-next" class="lightbox-nav-btn lightbox-next" aria-label="Следующий скриншот">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
              <polyline points="9 18 15 12 9 6"></polyline>
            </svg>
          </button>
        </div>

        <div class="lightbox-caption">
          <h3 id="lightbox-title" class="lightbox-title"></h3>
          <p id="lightbox-desc" class="lightbox-desc"></p>
        </div>
      </div>
    </div>

    <script src="app.js"></script>
  </body>
</html>
